<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Стан світла</title>
<style>
:root {
  --bg: #000000;
  --fg: #f5f5f7;
  --muted: #98989f;
  --accent: #0a84ff;
  --yellow: #ffd60a;
  --orange: #ff9f0a;
  --gray: #98989d;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }

body {
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.hero {
  --c: var(--gray);
  position: relative;
  isolation: isolate;
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 24px calc(40px + env(safe-area-inset-bottom, 0px));
}
.hero[data-state="on"]      { --c: var(--yellow); }
.hero[data-state="planned"] { --c: var(--orange); }

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: radial-gradient(60% 55% at 50% 38%, color-mix(in srgb, var(--c) 20%, transparent), transparent 72%);
  transition: background .5s ease;
}

.bulb {
  font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  font-size: clamp(110px, 28vw, 168px);
  line-height: 1;
  margin-bottom: 28px;
  user-select: none;
  transition: filter .5s ease, opacity .5s ease;
}
.hero[data-state="on"] .bulb {
  filter: drop-shadow(0 0 28px color-mix(in srgb, var(--yellow) 65%, transparent));
}
.hero[data-state="off"] .bulb,
.hero[data-state="planned"] .bulb,
.hero[data-state="unknown"] .bulb {
  filter: grayscale(1) brightness(.62) contrast(.9);
  opacity: .9;
}
.hero[data-state="loading"] .bulb {
  filter: grayscale(1) brightness(.7);
  animation: pulse 1.4s ease-in-out infinite;
}
@keyframes pulse { 50% { opacity: .4; } }

.big {
  margin: 0;
  font-size: clamp(36px, 8vw, 68px);
  line-height: 1.05;
  font-weight: 700;
  letter-spacing: -.03em;
}

.lead {
  max-width: 34em;
  margin: 18px 0 0;
  color: var(--muted);
  font-size: clamp(16px, 2.4vw, 19px);
  line-height: 1.5;
}

.lastping {
  margin: 14px 0 0;
  font-size: 15px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.meta {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 28px;
  font-size: 14px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.meta a { font-weight: 600; }
.lead[hidden] + .lastping[hidden] + .meta { margin-top: 18px; }

@media (prefers-reduced-motion: reduce) {
  .bulb { animation: none !important; transition: none; }
  .hero::before { transition: none; }
}
</style>
</head>
<body>
<main>
  <div class="hero" id="hero" data-state="loading">
    <div class="bulb" id="bulb" role="img" aria-label="Лампочка">💡</div>
    <h1 class="big" id="title">Перевіряємо…</h1>
    <p class="lead" id="msg" aria-live="polite">Перевіряємо, чи є світло вдома.</p>
    <p class="lastping" id="ping" hidden></p>
    <div class="meta">
      <span id="time"></span>
      <a href="https://quietpulse.xyz/status/2ef55dc4-ca03-463c-84ec-c39269c26345">Деталі</a>
    </div>
  </div>
</main>

<script>
var CH = "https://t.me/RomashkaSystems";
var API_URL  = "https://api.github.com/repos/Romashkaa/status-data/contents/services.json?ref=main";
var DATA_URL = "https://raw.githubusercontent.com/Romashkaa/status-data/main/services.json";
var JOB_ID = "2ef55dc4-ca03-463c-84ec-c39269c26345";
var PUBLIC_URL = "https://quietpulse.xyz/api/jobs/" + JOB_ID + "/public";
var SERVER_JOB = "https://quietpulse.xyz/api/jobs/2ef55dc4-ca03-463c-84ec-c39269c26345/badge.svg";

var STATES = [
  { re: /\bhealthy\b|\bok\b|\bup\b/i, state: "online" },
  { re: /\blate\b|\bdelayed\b/i, state: "late" },
  { re: /\bmissing\b|\bdown\b|\bfailed\b|\bmissed\b|\bdisabled\b|\bpaused\b/i, state: "offline" },
  { re: /\bnew\b|\bwaiting\b|\bpending\b/i, state: "pending" },
  { re: /\bunknown\b/i, state: "offline" }
];

function parse(svg) {
  var doc = new DOMParser().parseFromString(svg, "image/svg+xml");
  var text = (doc.documentElement.textContent || "").replace(/\s+/g, " ");
  for (var i = 0; i < STATES.length; i++) {
    if (STATES[i].re.test(text)) return STATES[i].state;
  }
  return "unknown";
}

var server = "loading", checkedAt = "", lastPing = "";
var STATUS_MAP = { healthy: "online", late: "late", pending: "pending", waiting: "pending", "new": "pending" };
var svcData = null, svcFailed = false;

function $(id) { return document.getElementById(id); }

function supervisorStopped() {
  return !!svcData && (svcData.supervisor === "stopped" || svcData.supervisor === "stopping");
}

var UI = {
  loading: ["Перевіряємо…", "Перевіряємо, чи є світло вдома"],
  on:      ["Світло є"],
  off:     ["Світла немає", 'Імовірно, вдома немає світла'],
  planned: ["Наразі не можна сказати", 'Сервер вимкнули на технічні роботи. Подробиці — в <a href="' + CH + '">Telegram-каналі</a>.'],
  unknown: ["Стан невідомий", 'Не вдалося перевірити стан. Новини дивіться в <a href="' + CH + '">Telegram-каналі</a>.']
};

function state() {
  if (server === "loading" || (!svcData && !svcFailed)) return "loading";
  if (server === "online" || server === "late") return "on";
  if (server === "offline") return supervisorStopped() ? "planned" : "off";
  return "unknown";
}

function render() {
  var st = state(), ui = UI[st];
  var desc = ui[1] || "";
  var p = $("ping"), pp = lastPing ? pingParts(lastPing) : null, line = "";

  if (pp && st === "off") {
    desc = "Світло вимкнули " + (pp.day ? pp.day + " " : "") + "о " + pp.time;
  }

  $("hero").dataset.state = st;
  $("title").textContent = ui[0];
  $("msg").innerHTML = desc;
  $("msg").hidden = !desc;
  $("time").textContent = checkedAt ? "Перевірено о " + checkedAt : "";

  if (pp && st === "planned") {
    line = "Технічні роботи з " + (pp.day ? pp.day + ", " : "") + pp.time;
  }
  p.textContent = line;
  p.hidden = !line;
}

function pingParts(iso) {
  try {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return null;
    var key = function (x) { return x.toLocaleDateString("en-CA", { timeZone: "Europe/Kyiv" }); };
    return {
      time: d.toLocaleTimeString("uk-UA", { timeZone: "Europe/Kyiv", hour: "2-digit", minute: "2-digit" }),
      day: key(d) === key(new Date()) ? "" : d.toLocaleDateString("uk-UA", { timeZone: "Europe/Kyiv", day: "numeric", month: "long" })
    };
  } catch (e) { return null; }
}

function withTimeout(url, ms) {
  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, ms);
  return fetch(url + "?t=" + Date.now(), { cache: "no-store", signal: ctrl.signal })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r; })
    .finally(function () { clearTimeout(timer); });
}

function loadServer() {
  withTimeout(PUBLIC_URL, 10000)
    .then(function (r) { return r.json(); })
    .then(function (j) {
      server = j.is_enabled === false ? "offline" : (STATUS_MAP[j.status] || "offline");
      lastPing = j.last_ping_at || "";
    })
    .catch(function () {
      return withTimeout(SERVER_JOB, 10000)
        .then(function (r) { return r.text(); })
        .then(function (svg) { server = parse(svg); })
        .catch(function () { server = "unknown"; });
    })
    .finally(function () {
      checkedAt = new Date().toLocaleTimeString("uk-UA", { hour: "2-digit", minute: "2-digit" });
      render();
    });
}

function getJSON(url, opts) {
  return fetch(url, opts).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
}

function loadData() {
  getJSON(API_URL, { cache: "no-cache", headers: { Accept: "application/vnd.github.raw+json" } })
    .catch(function () { return getJSON(DATA_URL + "?t=" + Date.now(), { cache: "no-store" }); })
    .then(function (j) { svcData = j; svcFailed = false; })
    .catch(function () { svcFailed = true; })
    .finally(render);
}

var lastRefresh = 0;
function refresh() {
  lastRefresh = Date.now();
  loadServer();
  loadData();
}

document.addEventListener("visibilitychange", function () {
  if (!document.hidden && Date.now() - lastRefresh > 15000) refresh();
});

render();
refresh();
setInterval(refresh, 60000);
</script>
</body>
</html>
